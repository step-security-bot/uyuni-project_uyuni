name: Update translation files

on:
  push:
    branches:
      - master-weblate
    paths:
      - 'web/po/*.po'
      - 'backend/po/*.po'
      - 'susemanager/po/*.po'
      - 'spacecmd/po/*.po'
      - 'java/core/src/main/resources/com/redhat/rhn/frontend/strings/database/StringResource_*.xml'
      - '!java/src/main/resources/com/redhat/rhn/frontend/strings/database/StringResource_en_US.xml'
      - 'java/src/main/resources/com/redhat/rhn/frontend/strings/java/StringResource_*.xml'
      - '!java/src/main/resources/com/redhat/rhn/frontend/strings/java/StringResource_en_US.xml'
      - 'java/src/main/resources/com/redhat/rhn/frontend/strings/jsp/StringResource_*.xml'
      - '!java/src/main/resources/com/redhat/rhn/frontend/strings/jsp/StringResource_en_US.xml'
      - 'java/src/main/resources/com/redhat/rhn/frontend/strings/nav/StringResource_*.xml'
      - '!java/src/main/resources/com/redhat/rhn/frontend/strings/nav/StringResource_en_US.xml'
      - 'java/src/main/resources/com/redhat/rhn/frontend/strings/template/StringResource_*.xml'
      - '!java/src/main/resources/com/redhat/rhn/frontend/strings/template/StringResource_en_US.xml'
      - 'client/rhel/yum-rhn-plugin/po/*.po'
      - 'client/rhel/mgr-daemon/po/*.po'
      - 'client/rhel/spacewalk-client-tools/po/*.po'

permissions:
  contents: read

jobs:
 run:
   permissions:
     actions: write  # for styfle/cancel-workflow-action to cancel/stop running workflows
     contents: write  # for Git to git push
   name: Update translation files
   if: github.repository == 'uyuni-project/uyuni'
   runs-on: ubuntu-latest
   steps:
   - name: Harden the runner (Audit all outbound calls)
     uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
     with:
       egress-policy: audit

   - name: Cancel Previous Runs
     uses: styfle/cancel-workflow-action@85880fa0301c86cca9da44039ee3bb12d3bedbfa #v0.12.1
     with:
         access_token: ${{ github.token }}

   - name: Checkout repo
     uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
     with:
       token: ${{ secrets.GH_TOKEN_GALAXY_CI }}

   - name: Setup tooling
     run: sudo apt-get install -y make git gettext intltool python3

   - name: Setup git
     run: |
       git config --global user.name "Galaxy CI"
       git config --global user.email "galaxy-ci@suse.de"

   - name: Align translations files
     run: scripts/translation/update-all-translation-strings.sh
     env:
       ADDITIONAL_SAFE_BRANCHNAME: master
       GITHUB_TOKEN: ${{ secrets.GH_TOKEN_GALAXY_CI }}

   - name: Push changes
     run: git push origin HEAD
